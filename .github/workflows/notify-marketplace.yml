name: Notify Marketplace

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update plugin.json version
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$PLUGIN_VERSION" '.version = $v' \
            .claude-plugin/plugin.json > tmp.json && mv tmp.json .claude-plugin/plugin.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git diff --staged --quiet || git commit -m "chore: bump plugin.json to ${{ steps.version.outputs.version }}"
          git push

      - name: Dispatch to marketplace
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          repository: AdamJ/productdesign-marketplace
          event-type: skills-released
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'
